                600: 'var(--brand-600)',
                900: 'var(--brand-900)',

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      :root {
        /* Default Theme (Slate/Blueish) */
        --brand-50: #f8fafc;
        --brand-100: #f1f5f9;
        --brand-500: #64748b;
        --brand-600: #475569;
        --brand-900: #0f172a;
      }

      /* Theme Presets Helper Classes (applied via JS) */
      .theme-indigo {
        --brand-50: #eef2ff;
        --brand-100: #e0e7ff;
        --brand-500: #6366f1;
        --brand-600: #4f46e5;
        --brand-900: #312e81;
      }

      .theme-green {
        --brand-50: #f0fdf4;
        --brand-100: #dcfce7;
        --brand-500: #22c55e;
        --brand-600: #16a34a;
        --brand-900: #14532d;
      }

      .theme-rose {
        --brand-50: #fff1f2;
        --brand-100: #ffe4e6;
        --brand-500: #f43f5e;
        --brand-600: #e11d48;
        --brand-900: #881337;
      }

      .theme-amber {
        --brand-50: #fffbeb;
        --brand-100: #fef3c7;
        --brand-500: #f59e0b;
        --brand-600: #d97706;
        --brand-900: #78350f;
      }

      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; transition: background-color 0.3s, color 0.3s; }
      html { scroll-behavior: smooth; }
      
      /* Dark Mode Base Overrides */
      .dark body { background-color: #0f172a; color: #f8fafc; }
